name: Repository upload safety

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject secret and private-data upload paths
        run: python3 -B ci/secret_scan.py --root "$GITHUB_WORKSPACE"
      - name: Verify credential redaction before printing backend diagnostics
        run: python3 -B ci/backend-console-test.py
