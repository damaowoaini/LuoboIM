name: Manual Mobile codec903 905 910 911 / forward-lifecycle fresh6 same-body-old7 exact39 / historical5 partial only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-tag903-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag903:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: One fresh owned allocation
        run: echo "TAG903_ROOT=$RUNNER_TEMP/mobile-tag903-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Linux Flutter tester runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-3-dev libglu1-mesa
      - name: Original current363 setup from exact parent projection then explicit fourteen-file successor
        run: |
          set -euo pipefail
          umask 077
          original_head="$(git -C "$GITHUB_WORKSPACE" rev-parse --verify 'HEAD^{commit}')"
          test "$original_head" = "$GITHUB_SHA"
          timeout --kill-after=5s 30s git -C "$GITHUB_WORKSPACE" fetch --quiet \
            --no-tags --no-recurse-submodules --depth=1 --no-write-fetch-head --no-auto-maintenance \
            origin 2f17d99d2f32c4fc72b9b922f8d2a8783938b665:refs/tag903/source-parent
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse --verify 'refs/tag903/source-parent^{commit}')" = '2f17d99d2f32c4fc72b9b922f8d2a8783938b665'
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse --verify 'HEAD^{commit}')" = "$original_head"
          # The unchanged setup verifies the fourteen exact git blobs before its one original setup call.
          python3 -B ci/mobile-tag903.py setup --allocation "$TAG903_ROOT"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse --verify 'HEAD^{commit}')" = "$original_head"
      - name: Only fresh format6 analyze6 plus same-body old analysis7 and selected39 with no VM service or business network
        run: |
          set -euo pipefail
          sudo unshare --net -- python3 -B "$GITHUB_WORKSPACE/ci/mobile-tag903.py" netns \
            --run-as "$(id -un)" --work "$TAG903_ROOT/work" 2>&1 \
            | tee "$TAG903_ROOT/work/evidence/tag903-controller.log"
      - name: Preserve bounded scope receipts and original setup failures
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: mobile-tag903-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TAG903_ROOT }}/work/evidence/
          if-no-files-found: warn
          retention-days: 14
