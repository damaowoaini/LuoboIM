name: Namespace progress R10 bounded observation of original Large

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: namespace-progress-performance-r10-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-large-profile:
    name: Exact product1206 plus diagnostic3 original10001/600s and bounded profiles
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOMAXPROCS: '2'
      GOMEMLIMIT: 900MiB
      LUOBO_EMAIL_INTEGRATION: '0'
      LUOBO_RUN_LEGACY_LOAD_TESTS: '0'
      LUOBO_RUN_LEGACY_EXAMPLES: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Safety and exact product1206 plus Root-formatted diagnostic3
        run: |
          python3 -B ci/secret_scan.py --root "$GITHUB_WORKSPACE"
          python3 -B ci/namespace-progress-performance-r5/run.py --verify
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.2'
          check-latest: false
          cache: false
      - name: Diagnostic sourcepost then original Large10001/600s/profiles only
        run: python3 -B ci/namespace-progress-performance-r5/run.py
      - name: Retain compact raw evidence on success or failure
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: namespace-progress-performance-r10-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results/namespace-progress-performance-r10/
          if-no-files-found: warn
          retention-days: 14
