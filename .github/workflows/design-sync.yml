name: Mobile and Web design consistency

on:
  push:
    paths:
      - 'app/lib/design/tokens.dart'
      - 'web/src/design/tokens.ts'
      - 'ci/design-sync*'
      - '.github/workflows/design-sync.yml'
  pull_request:
    paths:
      - 'app/lib/design/tokens.dart'
      - 'web/src/design/tokens.ts'
      - 'ci/design-sync*'
      - '.github/workflows/design-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-shared-primitives:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify actual mobile and Web palette and dimensions
        run: |
          python3 -B ci/design-sync.test.py
          python3 -B ci/design-sync.py
