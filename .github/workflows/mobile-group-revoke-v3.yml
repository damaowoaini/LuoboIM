name: Historical50ff Mobile group revoke V3 isolated target5

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-group-revoke-v3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate354-group-revoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Set fresh candidate workspace path
        run: echo "MOBILE_WORK=$RUNNER_TEMP/mobile-group-revoke-v3" >> "$GITHUB_ENV"
      - name: Checkout without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historical351 helper pins are intentionally frozen; never alias them to354.
          ref: 50ff7d3d705c52775bf37840e6bef10fa2a55ae0
          persist-credentials: false
      - name: Linux tester runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-3-dev libglu1-mesa
      - name: Prepare exact accepted351 inputs and official locked dependencies
        run: bash ci/mobile-setup.sh 'current351' "$MOBILE_WORK"
      - name: Overlay only isolated V3 six files into the owned workspace
        run: |
          set -euo pipefail
          python3 ci/mobile-group-revoke.py overlay --work "$MOBILE_WORK" 2>&1 \
            | tee "$MOBILE_WORK/evidence/group-revoke-overlay.log"
      - name: Analyze changed3 then run only five owned UI cases without external network
        run: |
          set -euo pipefail
          sudo unshare --net -- python3 "$GITHUB_WORKSPACE/ci/mobile-group-revoke.py" netns \
            --run-as "$(id -un)" --work "$MOBILE_WORK" 2>&1 \
            | tee "$MOBILE_WORK/evidence/group-revoke-controller.log"
      - name: Preserve all raw results and setup failures
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mobile-group-revoke-v3-${{ github.run_id }}
          path: ${{ env.MOBILE_WORK }}/evidence/
          if-no-files-found: warn
          retention-days: 14
