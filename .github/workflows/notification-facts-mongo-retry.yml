name: Positive notification facts failed-only Mongo four

# Only previously failed4Mongo/4sub. Prior pure1 and RPC stored-n1/1 plus SQL/HMAC/cleanup retained as prior actual evidence, not rerun.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notification-facts-mongo4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  target4:
    name: Non-authority facts / failed-only four Mongo tops four subs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOMAXPROCS: '2'
      GOMEMLIMIT: 900MiB
      LUOBO_EMAIL_INTEGRATION: '0'
      LUOBO_RUN_LEGACY_LOAD_TESTS: '0'
      LUOBO_RUN_LEGACY_EXAMPLES: '0'
      LUOBO_STORAGE_TEST_MONGO_URI: 'mongodb://127.0.0.1:37017/?replicaSet=luoboIntegration'
      LUOBO_GROUP_RECEIVER_TEST_MONGO_URI: 'mongodb://127.0.0.1:37017/?replicaSet=luoboIntegration'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Safety and exact facts source; two new pure controls must be reviewed and run locally once before adoption
        run: |
          python3 -B ci/secret_scan.py --root "$GITHUB_WORKSPACE"
          python3 -B ci/notification-facts-r1/run.py --verify
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.2'
          check-latest: false
          cache: false
      - name: Four GiB admission before any owned fixture
        run: |
          python3 -B - <<'PYCODE'
          import json, os
          from pathlib import Path
          free = os.statvfs(os.environ['RUNNER_TEMP'])
          value = free.f_bavail * free.f_frsize
          Path('ci-results').mkdir(exist_ok=True)
          record = {'freeBytes': value, 'minimumInitialBytes': 4 * 1024**3, 'accepted': value >= 4 * 1024**3}
          with Path('ci-results/notification-facts-r1-bootstrap.json').open('x') as out:
              json.dump(record, out); out.write('\n'); out.flush(); os.fsync(out.fileno())
          if not record['accepted']:
              raise SystemExit('4GiB bootstrap floor; fixtures not started')
          PYCODE
      - name: Prepare exact owned ephemeral Mongo and paired Redis
        run: |
          python3 -B ci/group-effects/resource_guard.py \
            --cwd "$GITHUB_WORKSPACE" \
            --log "$GITHUB_WORKSPACE/ci-results/notification-facts-r1-prepare.log" \
            --record "$GITHUB_WORKSPACE/ci-results/notification-facts-r1-prepare.resource.json" \
            --min-free-mib 1024 --timeout 600 --poll-interval .2 \
            -- bash ci/backend-integration.sh prepare
      - name: Only failed four Mongo facts tops and four subs; no prior pure or RPC
        run: python3 -B ci/notification-facts-r1/run.py
      - name: Always collect owned Mongo and Redis residuals
        if: always()
        run: |
          bash ci/backend-integration.sh collect
          python3 -B ci/notification-facts-r1/run.py --check-residuals
      - name: Always remove only exact run owned Mongo and Redis containers
        if: always()
        run: bash ci/backend-integration.sh cleanup
      - name: Require exact collection and cleanup after test results
        if: always()
        run: python3 -B ci/notification-facts-r1/run.py --check-cleanup
      - name: Preserve explicit public evidence only
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: notification-facts-mongo4-${{ github.run_id }}
          path: |
            ci-results/notification-facts-r1/
            ci-results/notification-facts-r1-bootstrap.json
            ci-results/notification-facts-r1-prepare.log
            ci-results/notification-facts-r1-prepare.resource.json
            ci-results/backend-integration/
          if-no-files-found: warn
          retention-days: 14
