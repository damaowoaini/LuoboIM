name: Fresh owned actual14 graph / original2 plus cleanup5 / fresh7top15sub

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-fullgraph-${{ github.ref }}
  cancel-in-progress: false

jobs:
  actual-graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact Root-frozen source and reviewed graph admission
        run: |
          umask 077
          python3 -B ci/secret_scan.py --root "$GITHUB_WORKSPACE"
          python3 -B ci/backend-fullgraph/run.py --verify
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.2'
          check-latest: false
          cache: false
      - name: Cold4GiB admission into one fresh task allocation
        run: |
          umask 077
          python3 -B ci/backend-fullgraph/run.py --admit
      - name: Build actual14 plus two auxiliaries; four fresh graph scenarios; fresh7top15sub
        run: |
          umask 077
          python3 -B ci/group-effects/resource_guard.py \
            --cwd "$GITHUB_WORKSPACE" \
            --log "$RUNNER_TEMP/backend-fullgraph-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/controller-private.log" \
            --record "$GITHUB_WORKSPACE/ci-results/backend-fullgraph-controller.resource.json" \
            --min-free-mib 1024 --timeout 10800 --poll-interval .2 \
            --allocated-root "$RUNNER_TEMP/backend-fullgraph-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --max-allocated-mib 16384 \
            -- python3 -B ci/backend-fullgraph/run.py
      - name: Always exact-ID resource cleanup and independent original runtime absence
        if: always()
        run: |
          umask 077
          python3 -B ci/backend-fullgraph/collect.py
      - name: Seal only fourteen existing product ELFs after successful independent cleanup
        if: success()
        run: |
          umask 077
          python3 -B ci/group-effects/resource_guard.py \
            --cwd "$GITHUB_WORKSPACE" \
            --log "$RUNNER_TEMP/backend-fullgraph-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/product-seal-private.log" \
            --record "$RUNNER_TEMP/backend-fullgraph-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/product-seal.resource.json" \
            --min-free-mib 1024 --timeout 60 --poll-interval .2 \
            --allocated-root "$RUNNER_TEMP/backend-fullgraph-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --max-allocated-mib 16384 \
            -- python3 -B ci/backend-fullgraph/collect.py --prepare-product-artifact
      - name: Preserve only fourteen sealed product ELFs and their manifest for seven days
        if: success()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: backend-fullgraph-product14-elf-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/backend-fullgraph-${{ github.run_id }}-${{ github.run_attempt }}/work/bin/api
            ${{ runner.temp }}/backend-fullgraph-${{ github.run_id }}-${{ github.run_attempt }}/work/bin/crontask
            ${{ runner.temp }}/backend-fullgraph-${{ github.run_id }}-${{ github.run_attempt }}/work/bin/msggateway
            ${{ runner.temp }}/backend-fullgraph-${{ github.run_id }}-${{ github.run_attempt }}/work/bin/msgtransfer-managed
            ${{ runner.temp }}/backend-fullgraph-${{ github.run_id }}-${{ github.run_attempt }}/work/bin/push
            ${{ runner.temp }}/backend-fullgraph-${{ github.run_id }}-${{ github.run_attempt }}/work/bin/rpc-auth
            ${{ runner.temp }}/backend-fullgraph-${{ github.run_id }}-${{ github.run_attempt }}/work/bin/rpc-conversation
            ${{ runner.temp }}/backend-fullgraph-${{ github.run_id }}-${{ github.run_attempt }}/work/bin/rpc-encryption
            ${{ runner.temp }}/backend-fullgraph-${{ github.run_id }}-${{ github.run_attempt }}/work/bin/rpc-friend
            ${{ runner.temp }}/backend-fullgraph-${{ github.run_id }}-${{ github.run_attempt }}/work/bin/rpc-group
            ${{ runner.temp }}/backend-fullgraph-${{ github.run_id }}-${{ github.run_attempt }}/work/bin/rpc-msg
            ${{ runner.temp }}/backend-fullgraph-${{ github.run_id }}-${{ github.run_attempt }}/work/bin/rpc-rtc
            ${{ runner.temp }}/backend-fullgraph-${{ github.run_id }}-${{ github.run_attempt }}/work/bin/rpc-third
            ${{ runner.temp }}/backend-fullgraph-${{ github.run_id }}-${{ github.run_attempt }}/work/bin/rpc-user
            ${{ runner.temp }}/backend-fullgraph-${{ github.run_id }}-${{ github.run_attempt }}/work/bin/manifest.json
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
      - name: Only bounded finite public receipts; no ELF/private source/config/logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: backend-fullgraph-receipts-${{ github.run_id }}
          path: ci-results/backend-fullgraph-compact/
          if-no-files-found: warn
          retention-days: 14
