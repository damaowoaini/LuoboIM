name: Mobile source validation

# Run full regression once after the known issues are fixed and targeted checks pass.
on:
  workflow_dispatch:
    inputs:
      validation_mode:
        description: "Focused new group revoke58, or one final full1280 + whole analyze"
        type: choice
        required: true
        default: group-revoke-58
        options:
          - group-revoke-58
          - full-regression
      reference_before_entry:
        description: "Also run full354 reference context with only4 baseline files (entry2 only)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-linux:
    name: current354 / Linux unit + widget + analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Set fresh workspace path
        run: echo "MOBILE_WORK=$RUNNER_TEMP/mobile-current354" >> "$GITHUB_ENV"
      - name: Checkout source without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux tester runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-3-dev libglu1-mesa
      - name: Validate CI reporter tools
        run: python3 ci/mobile-test-tools.py
      - name: Prepare exact source, official Flutter and locked dependencies
        run: bash ci/mobile-setup.sh 'current354' "$MOBILE_WORK"
      - name: Run selected manual validation with no external network or host fixtures
        env:
          VALIDATION_MODE: ${{ inputs.validation_mode }}
          RUN_REFERENCE_ENTRY: ${{ github.event_name == 'workflow_dispatch' && inputs.reference_before_entry && 'true' || 'false' }}
        run: |
          [[ "$VALIDATION_MODE" == group-revoke-58 || "$VALIDATION_MODE" == full-regression ]]
          [[ "$RUN_REFERENCE_ENTRY" != true || "$VALIDATION_MODE" == full-regression ]]
          reference_args=()
          if [[ "$RUN_REFERENCE_ENTRY" == true ]]; then reference_args=(reference-before-entry); fi
          sudo unshare --net -- bash "$GITHUB_WORKSPACE/ci/mobile-netns.sh" \
            "$(id -un)" "$GITHUB_WORKSPACE" "$MOBILE_WORK" 'current354' "$VALIDATION_MODE" "${reference_args[@]}"
      - name: Preserve actual results and setup failures
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mobile-current354-${{ github.run_id }}
          path: ${{ env.MOBILE_WORK }}/evidence/
          if-no-files-found: warn
          retention-days: 14
