name: Mobile source validation

on:
  pull_request:
    paths:
      - 'app/**'
      - 'packages/flutter_openim_sdk/lib/**'
      - 'packages/flutter_openim_sdk/pubspec.yaml'
      - 'packages/flutter_openim_sdk/tool/fixture_native_endpoint_messenger.dart'
      - 'migration/legacy_personal_export/**'
      - 'ci/mobile*'
      - 'ci/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [main, master, 'codex/**']
    paths:
      - 'app/**'
      - 'packages/flutter_openim_sdk/lib/**'
      - 'packages/flutter_openim_sdk/pubspec.yaml'
      - 'packages/flutter_openim_sdk/tool/fixture_native_endpoint_messenger.dart'
      - 'migration/legacy_personal_export/**'
      - 'ci/mobile*'
      - 'ci/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:
    inputs:
      reference_before_entry:
        description: "Also run full294 reference context with only4 baseline files (entry2 only)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-linux:
    name: current294 / Linux unit + widget + analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Set fresh workspace path
        run: echo "MOBILE_WORK=$RUNNER_TEMP/mobile-current294" >> "$GITHUB_ENV"
      - name: Checkout source without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux tester runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-3-dev libglu1-mesa
      - name: Validate CI reporter tools
        run: python3 ci/mobile-test-tools.py
      - name: Prepare exact source, official Flutter and locked dependencies
        run: bash ci/mobile-setup.sh 'current294' "$MOBILE_WORK"
      - name: Test184 (shortcuts18 + chat-route3 + group-entry29 + creation37 + QR51 + search46), full872 and analyze with no external network or host fixtures
        env:
          RUN_REFERENCE_ENTRY: ${{ github.event_name == 'workflow_dispatch' && inputs.reference_before_entry && 'true' || 'false' }}
        run: |
          reference_args=()
          if [[ "$RUN_REFERENCE_ENTRY" == true ]]; then reference_args=(reference-before-entry); fi
          sudo unshare --net -- bash "$GITHUB_WORKSPACE/ci/mobile-netns.sh" \
            "$(id -un)" "$GITHUB_WORKSPACE" "$MOBILE_WORK" 'current294' "${reference_args[@]}"
      - name: Preserve actual results and setup failures
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mobile-current294-${{ github.run_id }}
          path: ${{ env.MOBILE_WORK }}/evidence/
          if-no-files-found: warn
          retention-days: 14
