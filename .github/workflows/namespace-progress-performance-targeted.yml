name: Namespace progress performance targeted six

# Only affected Progress4 + new memo/row2. Historical Chunk/CLI/DB suites retained, never rerun here.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: namespace-progress-performance-target6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  target6:
    name: Private filesystem and BSON / exact six tops and seventeen subs
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOMAXPROCS: '2'
      GOMEMLIMIT: 900MiB
      LUOBO_EMAIL_INTEGRATION: '0'
      LUOBO_RUN_LEGACY_LOAD_TESTS: '0'
      LUOBO_RUN_LEGACY_EXAMPLES: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Safety and exact corrected1184 to1197 to formatted1199 source
        run: |
          python3 -B ci/secret_scan.py --root "$GITHUB_WORKSPACE"
          python3 -B ci/namespace-progress-performance/run.py --verify
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.2'
          check-latest: false
          cache: false
      - name: Only pure Progress6top17sub / original10001 and600s / no database fixture
        run: python3 -B ci/namespace-progress-performance/run.py
      - name: Preserve original raw evidence only; task source and journals stay off artifact
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: namespace-progress-performance-target6-${{ github.run_id }}
          path: ci-results/namespace-progress-performance/
          if-no-files-found: warn
          retention-days: 14
