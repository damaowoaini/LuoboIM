name: Manual personal migration new10 picker2 and portable browser1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-multipart-targeted-${{ github.ref }}
  cancel-in-progress: false

jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: candidate
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1ef9d4920278da3aa407a2c8f6d4fc37fd12896b
          path: personal-parent
          fetch-depth: 2
          persist-credentials: false
      - name: One fresh owned allocation and existing runner Chrome
        run: echo "PERSONAL_ROOT=$RUNNER_TEMP/personal-multipart-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Same Linux tester runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-3-dev libglu1-mesa
      - name: Normalize only the preinstalled hosted-runner Chrome executable mode
        run: |
          set -euo pipefail
          timeout --kill-after=2s 10s sudo -n -- python3 -B - <<'PY'
          import json, os, stat
          from pathlib import Path

          def normalize_chrome(path, *, owner_uid=0):
              path = Path(path)
              if not path.is_absolute() or path.resolve(strict=True) != path:
                  raise ValueError('fixed Chrome path must be canonical without symlinks')
              before = path.lstat()
              descriptor = os.open(path, os.O_RDONLY | os.O_CLOEXEC | os.O_NOFOLLOW | os.O_NONBLOCK)
              try:
                  opened = os.fstat(descriptor)
                  mode = stat.S_IMODE(opened.st_mode)
                  if not stat.S_ISREG(opened.st_mode) or opened.st_uid != owner_uid or mode not in (0o777, 0o755):
                      raise ValueError('installed Chrome must be root regular with known0777 or0755: uid=' +
                                       str(opened.st_uid) + ' mode=' + oct(mode))
                  def identity(info):
                      return (info.st_dev, info.st_ino, info.st_uid, info.st_gid, info.st_size, info.st_mtime_ns)
                  if (identity(before) != identity(opened) or before.st_mode != opened.st_mode
                          or before.st_ctime_ns != opened.st_ctime_ns):
                      raise ValueError('installed Chrome changed while opening')
                  if mode == 0o777:
                      os.fchmod(descriptor, 0o755)
                  after = os.fstat(descriptor)
                  current = path.lstat()
                  if (identity(opened) != identity(after) or identity(after) != identity(current)
                          or stat.S_IMODE(after.st_mode) != 0o755 or after.st_mode != current.st_mode
                          or after.st_ctime_ns != current.st_ctime_ns or path.resolve(strict=True) != path):
                      raise ValueError('installed Chrome identity or normalized mode changed')
                  return {'path': str(path), 'uid': after.st_uid, 'before_mode': oct(mode),
                          'after_mode': oct(stat.S_IMODE(after.st_mode)), 'bytes': after.st_size}
              finally:
                  os.close(descriptor)

          try:
              if os.geteuid() != 0:
                  raise ValueError('hosted-runner Chrome normalization requires root')
              observation = normalize_chrome(Path('/opt/google/chrome/chrome'))
          except (OSError, ValueError, RuntimeError) as error:
              print(json.dumps({'event': 'personal_chrome_mode_normalization', 'accepted': False,
                                'exceptionType': type(error).__name__, 'reason': str(error)[:512]},
                               sort_keys=True), flush=True)
              raise
          print(json.dumps(dict(observation, event='personal_chrome_mode_normalization', accepted=True),
                           sort_keys=True), flush=True)
          PY
      - name: One exact original setup then explicit legacy8 successor and web precache
        run: |
          set -euo pipefail
          parent="$GITHUB_WORKSPACE/personal-parent"
          test "$(git -C "$parent" rev-parse --verify 'HEAD^{commit}')" = '1ef9d4920278da3aa407a2c8f6d4fc37fd12896b'
          timeout --kill-after=5s 30s git -C "$parent" fetch --quiet \
            --no-tags --no-recurse-submodules --depth=1 --no-write-fetch-head --no-auto-maintenance \
            origin 2f17d99d2f32c4fc72b9b922f8d2a8783938b665:refs/tag903/source-parent
          python3 -B "$GITHUB_WORKSPACE/candidate/ci/personal-multipart.py" setup \
            --parent "$parent" --allocation "$PERSONAL_ROOT"
      - name: Only format7 static8 exact12 and Chrome codec1 with no business network
        run: |
          set -euo pipefail
          sudo unshare --net -- python3 -B "$GITHUB_WORKSPACE/candidate/ci/personal-multipart.py" netns \
            --parent "$GITHUB_WORKSPACE/personal-parent" --run-as "$(id -un)" \
            --work "$PERSONAL_ROOT/work" 2>&1 | tee "$PERSONAL_ROOT/work/evidence/personal-controller.log"
      - name: Preserve finite receipts and original setup failures
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: personal-multipart-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PERSONAL_ROOT }}/work/evidence/
          if-no-files-found: warn
          retention-days: 14
