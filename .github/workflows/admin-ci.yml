name: Admin CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Node 24.21.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Admin CI helper contract tests
        run: |
          mkdir -p ci-output/admin-helpers
          node --test --test-reporter=spec --test-reporter-destination=ci-output/admin-helpers/unit.log --test-reporter=junit --test-reporter-destination=ci-output/admin-helpers/unit.junit.xml ci/admin-ci.test.mjs
      - name: Locked install, explicit Max setup, core tests, types, build
        run: node ci/admin-ci.mjs
      - name: Preserve reports on success or failure
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: admin-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-output/admin/*.log
            ci-output/admin/*.json
            ci-output/admin/*.xml
            ci-output/admin-helpers/*.log
            ci-output/admin-helpers/*.xml
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: false
      - name: Downloadable Admin review bundle (never deploy)
        if: always() && hashFiles('ci-output/admin/dist-manifest.json') != ''
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: admin-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-output/admin/dist/
            ci-output/admin/dist-manifest.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
