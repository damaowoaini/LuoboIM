name: Manual Mobile announcement candidate359 target26

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-announcement-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate359-announcement:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Set fresh candidate workspace path
        run: echo "MOBILE_WORK=$RUNNER_TEMP/mobile-announcement26" >> "$GITHUB_ENV"
      - name: Checkout without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: a45daef88c28927910023f911d15a39a070c9989 # immutable actual historical354-helper/359-overlay context
      - name: Linux tester runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-3-dev libglu1-mesa
      - name: Prepare exact354 inputs and official locked dependencies
        run: bash ci/mobile-setup.sh 'current354' "$MOBILE_WORK"
      - name: Overlay only formatted announcement eleven into owned source
        run: |
          set -euo pipefail
          python3 ci/mobile-announcement.py overlay --work "$MOBILE_WORK" 2>&1 \
            | tee "$MOBILE_WORK/evidence/announcement-overlay.log"
      - name: Reuse five exact analyses, collect remaining six then only new24 and old2
        run: |
          set -euo pipefail
          sudo unshare --net -- python3 "$GITHUB_WORKSPACE/ci/mobile-announcement.py" netns \
            --run-as "$(id -un)" --work "$MOBILE_WORK" 2>&1 \
            | tee "$MOBILE_WORK/evidence/announcement-controller.log"
      - name: Preserve raw reports and setup failures
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mobile-announcement26-${{ github.run_id }}
          path: ${{ env.MOBILE_WORK }}/evidence/
          if-no-files-found: warn
          retention-days: 14
