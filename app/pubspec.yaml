name: imapp
description: "萝卜对话多租户即时通讯客户端"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.1.0
  dio: 5.11.1
  crypto: ^3.0.7
  flutter_secure_storage: 11.2.0
  shared_preferences: 2.5.6
  url_launcher: ^6.3.2
  path_provider: 2.1.6
  flutter_openim_sdk:
    path: ../packages/flutter_openim_sdk
  sqflite: ^2.4.4+2
  file_selector: ^1.1.0
  share_plus: ^13.3.1
  image_picker: ^1.2.4
  record: ^7.1.2
  just_audio: ^0.10.6
  video_player: ^2.14.1
  livekit_client: ^2.13.1
  permission_handler: ^13.0.2
  logging: ^1.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.4

flutter:
  uses-material-design: true
