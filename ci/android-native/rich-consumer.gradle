// Finite accepted-R12 gate library. No repository/selection mutation.
import groovy.json.JsonOutput
import org.gradle.api.GradleException
import java.nio.file.Files
import java.nio.file.LinkOption
import org.gradle.api.artifacts.ExternalModuleDependency
import org.gradle.api.artifacts.component.ModuleComponentSelector
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.component.ProjectComponentIdentifier
import org.gradle.api.artifacts.result.ResolvedDependencyResult
import org.gradle.api.artifacts.result.UnresolvedDependencyResult

return { File owned, Map source, Closure localRef, Closure fileDigest, String catalogSha ->
    def vc = { x -> [required:x.requiredVersion,strict:x.strictVersion,preferred:x.preferredVersion,
                    rejected:x.rejectedVersions,branch:x.branch] }
    def attrs = { x -> x.keySet().collectEntries { [(it.name):[type:it.type.name,value:String.valueOf(x.getAttribute(it))]] } }
    def caps = { x -> x.collect { [group:it.group,name:it.name,version:it.version] }.sort { JsonOutput.toJson(it) } }
    def module = { x ->
        if (!(x instanceof ModuleComponentIdentifier)) throw new GradleException('rich selected non-module refused')
        [group:x.group,module:x.module,version:x.version]
    }
    def request = { x ->
        if (!(x instanceof ModuleComponentSelector)) throw new GradleException('rich requested type refused')
        [group:x.group,module:x.module,version:x.version,constraint:vc(x.versionConstraint),
         attributes:attrs(x.attributes),requestedCapabilities:caps(x.requestedCapabilities),
         capabilitySelectors:x.capabilitySelectors.collect { [type:it.class.name,value:it.toString()] }.sort { JsonOutput.toJson(it) }]
    }
    def fixed = { v -> v == null || v == '' || (v ==~ /[A-Za-z0-9][A-Za-z0-9_.-]{0,127}/ &&
                         !v.toLowerCase().contains('snapshot') && !v.toLowerCase().contains('latest')) }
    def isRich = { x -> ![x.requiredVersion,x.strictVersion,x.preferredVersion].every(fixed) ||
                          !x.rejectedVersions.empty || x.branch!=null }
    def spec = { c -> source.configurations.find { it.name==c.name } }
    def scoped = { p,c ->
        if (spec(c)==null || p.path!=source.scope.project ||
                p.rootProject.projectDir.absoluteFile!=new File(owned,source.scope.root_relative) ||
                p.projectDir.absoluteFile!=new File(owned,source.scope.root_relative+'/app') ||
                !p.configurations.any { it.is(c) }) return false
        source.scope.sources.each { path,sha ->
            def f=new File(owned,(source.scope.file_prefix ?: 'source/')+path)
            if (f.canonicalFile!=f.absoluteFile || !Files.isRegularFile(f.toPath(),LinkOption.NOFOLLOW_LINKS) || fileDigest(f)!=sha)
                throw new GradleException('rich owner project source/generator scope differs')
        }
        if (p.gradle.gradleVersion!='9.3.1') throw new GradleException('rich Gradle source differs')
        true
    }
    def normalize
    normalize = { x -> x instanceof Map ? x.keySet().sort().collectEntries { [(it):normalize(x[it])] } :
                        x instanceof List ? x.collect { normalize(it) } : x }
    def canonical = { x -> JsonOutput.toJson(normalize(x)) }
    def declarations = { p,c ->
        if (!scoped(p,c)) throw new GradleException('rich scoped configuration refused')
        if (!c.resolutionStrategy.forcedModules.empty || attrs(c.attributes)!=spec(c).attributes)
            throw new GradleException('rich forced/configuration attributes refused')
        def actual=c.allDependencies.collect { d ->
            if (!(d instanceof ExternalModuleDependency) || d.changing)
                throw new GradleException('rich declared dependency type/force refused')
            [group:d.group,module:d.name,constraint:vc(d.versionConstraint),attributes:attrs(d.attributes),
             requestedCapabilities:caps(d.requestedCapabilities)]
        }
        if (actual.collect(canonical).sort()!=spec(c).declared.collect(canonical).sort())
            throw new GradleException('rich declared roots/generator differ')
    }
    def allowRequested = { p,c,x ->
        if (!scoped(p,c)) throw new GradleException('dynamic dependency version refused')
        def q=request(x)
        def matches=source.rich.findAll { it.configuration==c.name && it.group==q.group &&
            it.module==q.module && it.constraint==q.constraint }
        if (matches.size()!=1 || q.attributes!=[:] || !q.requestedCapabilities.empty || !q.capabilitySelectors.empty)
            throw new GradleException('rich fourth or changed complete selector refused')
        // Parent identity is unavailable in substitution; it is mandatory in
        // the complete resolved-edge audit before the consumer returns.
        q
    }
    def variant
    variant = { v -> [owner:module(v.owner),attributes:attrs(v.attributes),capabilities:caps(v.capabilities),
        external:v.externalVariant.present ? [display:v.externalVariant.get().displayName,
            owner:module(v.externalVariant.get().owner),attributes:attrs(v.externalVariant.get().attributes),
            capabilities:caps(v.externalVariant.get().capabilities)] : null] }
    def audit = { p,c ->
        declarations(p,c)
        def graph=c.incoming.resolutionResult
        def edges=graph.allDependencies.collect { e ->
            if (e instanceof UnresolvedDependencyResult) throw new GradleException('rich actual unresolved',e.failure)
            if (!(e instanceof ResolvedDependencyResult)) throw new GradleException('rich unknown edge')
            if (e.selected.selectionReason.forced || e.selected.selectionReason.selectedByRule)
                throw new GradleException('rich forced/substituted result refused')
            def from=e.from.id==graph.root.id ? [kind:'producer-root'] : module(e.from.id)
            [from:from,requested:request(e.requested),selected:module(e.selected.id)]
        }
        if (edges.collect(canonical).sort()!=spec(c).edges.collect(canonical).sort())
            throw new GradleException('rich parent/constraint/selected complete graph differs')
        def artifacts=c.incoming.artifacts.artifacts.collect { a ->
            def f=localRef(a.file)
            [id:module(a.id.componentIdentifier),filename:a.file.name,bytes:f.bytes,sha256:f.sha256,variant:variant(a.variant)]
        }
        def projected=spec(c).artifacts.collect { a -> a.findAll { k,v -> k!='origin' } }
        if (artifacts.collect(canonical).sort()!=projected.collect(canonical).sort())
            throw new GradleException('rich artifact18 selected/body differs')
        [catalog_sha256:catalogSha,project:p.path,configuration:c.name,scope_sources:source.scope.sources,
         no_force_or_substitution:true,edges:edges,artifacts:artifacts]
    }
    [isRich:isRich,scoped:scoped,declarations:declarations,requested:allowRequested,audit:audit]
}
