# Public source example. All credential/key scalars are intentionally empty.
# CI copies this example only for isolated source tests; it provisions no services.
# Configure deployment credentials separately; do not commit local runtime YAML.
# Durable IM account provisioning is always enabled. Central route binding is
# explicit; a false setting reports direct_only rather than claiming a binding.
# LUOBO_ROUTE_SHARED_SECRET is the dedicated tenant service secret (>=32 bytes).
adminProvisioning:
  enabled: false
  serverID: ""
  routeURL: ""
  allowLoopbackHTTP: false

# Match the IM issuer for this tenant. Management capabilities fail closed until set.
adminDelegation:
  issuer: ""

